name: CI

# Trigger the workflow on push to master / main, or on pull request
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        extra-pkgs: ['', 'vim']

    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          extra-pkgs-to-install: ${{ matrix.extra-pkgs }}
